<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý người dùng CRUD</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap');

      :root {
        --text-main: #152a30;
        --muted: #4b5f66;
        --label: #34555e;
        --focus: #127385;
        --field-border: #c5d6da;
        --field-bg: #ffffff;

        font-family: 'Be Vietnam Pro', 'Segoe UI', sans-serif;
        line-height: 1.5;
        font-weight: 400;
        color: var(--text-main);
        background: radial-gradient(circle at 20% 10%, #dff1ef 0%, #f4f9f8 42%, #fbfcfb 100%);
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      h1,
      h2 {
        font-family: 'IBM Plex Serif', Georgia, serif;
        color: #0f2e36;
      }

      .page {
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 42px 18px 56px;
      }

      .panel {
        width: min(1160px, 100%);
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.92), rgba(243, 250, 249, 0.85));
        border: 1px solid rgba(22, 63, 72, 0.18);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(18, 71, 82, 0.14);
        padding: 28px;
        animation: panel-enter 480ms ease;
      }

      .panel-header h1 {
        margin: 0;
      }

      .search-wrap {
        margin-bottom: 18px;
      }

      .search-wrap label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.92rem;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--label);
      }

      .search-wrap input,
      .user-form input {
        width: 100%;
        border: 1px solid var(--field-border);
        border-radius: 12px;
        background: var(--field-bg);
        color: var(--text-main);
        padding: 11px 12px;
        font-size: 0.96rem;
        transition: border-color 180ms ease, box-shadow 180ms ease;
        box-sizing: border-box;
      }

      .search-wrap input:focus,
      .user-form input:focus {
        outline: none;
        border-color: var(--focus);
        box-shadow: 0 0 0 3px rgba(18, 115, 133, 0.18);
      }

      .user-form {
        background: rgba(255, 255, 255, 0.76);
        border: 1px solid rgba(22, 63, 72, 0.16);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 22px;
      }

      .user-form h2 {
        margin: 0 0 14px;
        font-size: 1.16rem;
      }

      .grid-fields {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .grid-fields label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.9rem;
        color: var(--label);
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .btn {
        border: 0;
        border-radius: 10px;
        padding: 9px 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn-primary {
        background: #125d69;
        color: #ffffff;
      }

      .btn-primary:hover {
        box-shadow: 0 8px 16px rgba(18, 93, 105, 0.28);
      }

      .btn-ghost {
        background: #e8eef0;
        color: #1a3740;
      }

      .btn-edit {
        background: #ffd66f;
        color: #4d3900;
        padding: 6px 10px;
      }

      .btn-delete {
        background: #ffe4de;
        color: #7b2116;
        padding: 6px 10px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 980px;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
      }

      thead {
        background: linear-gradient(90deg, #113d46, #165965);
        color: #ffffff;
      }

      th,
      td {
        border-bottom: 1px solid #e7eef0;
        text-align: left;
        padding: 10px;
        font-size: 0.9rem;
        vertical-align: top;
      }

      tbody tr {
        animation: row-enter 300ms ease;
      }

      tbody tr:nth-child(even) {
        background: #f8fbfb;
      }

      .table-actions {
        display: flex;
        gap: 8px;
      }

      .table-message {
        padding: 16px;
        border-radius: 12px;
        background: #ecf6f7;
        color: #17454e;
      }

      .table-error {
        background: #ffe7e3;
        color: #7e2114;
      }

      .pagination-wrap {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
        flex-wrap: wrap;
      }

      .pagination-summary {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .pagination-controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .pagination-controls label {
        font-size: 0.9rem;
        color: var(--label);
      }

      .pagination-controls select {
        border: 1px solid var(--field-border);
        border-radius: 10px;
        background: var(--field-bg);
        color: var(--text-main);
        padding: 8px 10px;
        font-size: 0.92rem;
      }

      .pagination-controls button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .page-indicator {
        min-width: 106px;
        text-align: center;
        font-weight: 600;
        color: #1a3740;
      }

      @keyframes panel-enter {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes row-enter {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 1024px) {
        .page {
          padding: 24px 12px 28px;
        }

        .panel {
          padding: 16px;
          border-radius: 14px;
        }

        .grid-fields {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 640px) {
        .grid-fields {
          grid-template-columns: 1fr;
        }

        .form-actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }

        .pagination-controls {
          width: 100%;
        }

        .pagination-controls label {
          width: 100%;
        }

        .pagination-controls select,
        .page-indicator {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { useEffect, useMemo, useState } = React

      const PAGE_SIZE_OPTIONS = [5, 10, 20, 50]

      const INITIAL_FORM = {
        name: '',
        username: '',
        email: '',
        street: '',
        suite: '',
        city: '',
        phone: '',
      }

      function createFormFromUser(user) {
        if (!user) {
          return INITIAL_FORM
        }

        return {
          name: user.name ?? '',
          username: user.username ?? '',
          email: user.email ?? '',
          street: user.address?.street ?? '',
          suite: user.address?.suite ?? '',
          city: user.address?.city ?? '',
          phone: user.phone ?? '',
        }
      }

      function SearchForm({ value, onChangeValue }) {
        return (
          <div className="search-wrap">
            <label htmlFor="search-input">Tìm kiếm người dùng</label>
            <input
              id="search-input"
              type="text"
              placeholder="Tìm theo tên, username, email"
              value={value}
              onChange={(event) => onChangeValue(event.target.value)}
            />
          </div>
        )
      }

      function AddUser({ editingUser, onSubmit, onCancelEdit }) {
        const [form, setForm] = useState(() => createFormFromUser(editingUser))

        function handleChange(event) {
          const { name, value } = event.target
          setForm((prevForm) => ({
            ...prevForm,
            [name]: value,
          }))
        }

        function handleSubmit(event) {
          event.preventDefault()

          if (!form.name.trim() || !form.username.trim() || !form.email.trim()) {
            return
          }

          onSubmit({
            name: form.name.trim(),
            username: form.username.trim(),
            email: form.email.trim(),
            address: {
              street: form.street.trim(),
              suite: form.suite.trim(),
              city: form.city.trim(),
            },
            phone: form.phone.trim(),
          })

          if (!editingUser) {
            setForm(INITIAL_FORM)
          }
        }

        return (
          <form className="user-form" onSubmit={handleSubmit}>
            <h2>{editingUser ? 'Cập nhật người dùng' : 'Thêm người dùng mới'}</h2>

            <div className="grid-fields">
              <label>
                Họ tên
                <input
                  type="text"
                  name="name"
                  value={form.name}
                  onChange={handleChange}
                  required
                />
              </label>

              <label>
                Username
                <input
                  type="text"
                  name="username"
                  value={form.username}
                  onChange={handleChange}
                  required
                />
              </label>

              <label>
                Email
                <input
                  type="email"
                  name="email"
                  value={form.email}
                  onChange={handleChange}
                  required
                />
              </label>

              <label>
                Số điện thoại
                <input
                  type="text"
                  name="phone"
                  value={form.phone}
                  onChange={handleChange}
                />
              </label>

              <label>
                Street
                <input
                  type="text"
                  name="street"
                  value={form.street}
                  onChange={handleChange}
                />
              </label>

              <label>
                Suite
                <input
                  type="text"
                  name="suite"
                  value={form.suite}
                  onChange={handleChange}
                />
              </label>

              <label>
                City
                <input
                  type="text"
                  name="city"
                  value={form.city}
                  onChange={handleChange}
                />
              </label>
            </div>

            <div className="form-actions">
              <button className="btn btn-primary" type="submit">
                {editingUser ? 'Lưu thay đổi' : 'Thêm người dùng'}
              </button>

              {editingUser && (
                <button
                  className="btn btn-ghost"
                  type="button"
                  onClick={onCancelEdit}
                >
                  Hủy
                </button>
              )}
            </div>
          </form>
        )
      }

      function ResultTable({
        users,
        totalItems,
        loading,
        error,
        currentPage,
        totalPages,
        pageSize,
        pageSizeOptions,
        onPageChange,
        onPageSizeChange,
        onEdit,
        onDelete,
      }) {
        if (loading) {
          return <p className="table-message">Đang tải dữ liệu...</p>
        }

        if (error) {
          return <p className="table-message table-error">{error}</p>
        }

        if (!users.length) {
          return <p className="table-message">Không tìm thấy người dùng phù hợp.</p>
        }

        const startIndex = (currentPage - 1) * pageSize + 1
        const endIndex = Math.min(currentPage * pageSize, totalItems)

        function handlePageSizeChange(event) {
          onPageSizeChange(Number(event.target.value))
        }

        return (
          <div>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Họ tên</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Địa chỉ</th>
                    <th>Số điện thoại</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody>
                  {users.map((user) => (
                    <tr key={user.id}>
                      <td>{user.id}</td>
                      <td>{user.name}</td>
                      <td>{user.username}</td>
                      <td>{user.email}</td>
                      <td>
                        {user.address?.street}, {user.address?.suite}, {user.address?.city}
                      </td>
                      <td>{user.phone}</td>
                      <td>
                        <div className="table-actions">
                          <button className="btn btn-edit" onClick={() => onEdit(user)}>
                            Sửa
                          </button>
                          <button className="btn btn-delete" onClick={() => onDelete(user.id)}>
                            Xóa
                          </button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="pagination-wrap">
              <div className="pagination-summary">
                Hiển thị {startIndex}-{endIndex} trên tổng {totalItems} người dùng
              </div>

              <div className="pagination-controls">
                <label htmlFor="page-size-select">Số dòng/trang</label>
                <select
                  id="page-size-select"
                  value={pageSize}
                  onChange={handlePageSizeChange}
                >
                  {pageSizeOptions.map((option) => (
                    <option key={option} value={option}>
                      {option}
                    </option>
                  ))}
                </select>

                <button
                  className="btn btn-ghost"
                  type="button"
                  onClick={() => onPageChange(currentPage - 1)}
                  disabled={currentPage === 1}
                >
                  Trước
                </button>

                <span className="page-indicator">
                  Trang {currentPage}/{totalPages}
                </span>

                <button
                  className="btn btn-ghost"
                  type="button"
                  onClick={() => onPageChange(currentPage + 1)}
                  disabled={currentPage === totalPages}
                >
                  Sau
                </button>
              </div>
            </div>
          </div>
        )
      }

      function App() {
        const [keyword, setKeyword] = useState('')
        const [users, setUsers] = useState([])
        const [loading, setLoading] = useState(true)
        const [error, setError] = useState('')
        const [editingUser, setEditingUser] = useState(null)
        const [pageSize, setPageSize] = useState(5)
        const [currentPage, setCurrentPage] = useState(1)

        useEffect(() => {
          const controller = new AbortController()

          async function fetchUsers() {
            setLoading(true)
            setError('')

            try {
              const response = await fetch('https://jsonplaceholder.typicode.com/users', {
                signal: controller.signal,
              })

              if (!response.ok) {
                throw new Error('Không thể tải danh sách người dùng.')
              }

              const data = await response.json()
              setUsers(data)
            } catch (fetchError) {
              if (fetchError.name !== 'AbortError') {
                setError(fetchError.message)
              }
            } finally {
              setLoading(false)
            }
          }

          fetchUsers()
          return () => controller.abort()
        }, [])

        const filteredUsers = useMemo(() => {
          const kw = keyword.trim().toLowerCase()

          if (!kw) {
            return users
          }

          return users.filter((user) => {
            return (
              user.name.toLowerCase().includes(kw) ||
              user.username.toLowerCase().includes(kw) ||
              user.email.toLowerCase().includes(kw)
            )
          })
        }, [keyword, users])

        const totalPages = Math.max(1, Math.ceil(filteredUsers.length / pageSize))

        const paginatedUsers = useMemo(() => {
          const start = (currentPage - 1) * pageSize
          return filteredUsers.slice(start, start + pageSize)
        }, [filteredUsers, currentPage, pageSize])

        useEffect(() => {
          setCurrentPage(1)
        }, [keyword, pageSize])

        useEffect(() => {
          if (currentPage > totalPages) {
            setCurrentPage(totalPages)
          }
        }, [currentPage, totalPages])

        function upsertUser(userData) {
          if (editingUser) {
            setUsers((prevUsers) =>
              prevUsers.map((user) =>
                user.id === editingUser.id
                  ? {
                      ...user,
                      ...userData,
                    }
                  : user,
              ),
            )
            setEditingUser(null)
            return
          }

          const nextId = users.reduce((maxId, user) => Math.max(maxId, user.id), 0) + 1

          setUsers((prevUsers) => [
            {
              id: nextId,
              ...userData,
            },
            ...prevUsers,
          ])
        }

        function removeUser(userId) {
          setUsers((prevUsers) => prevUsers.filter((user) => user.id !== userId))

          if (editingUser?.id === userId) {
            setEditingUser(null)
          }
        }

        return (
          <main className="page">
            <section className="panel">
              <header className="panel-header">
                <h1>Quản lý người dùng</h1>
              </header>

              <SearchForm value={keyword} onChangeValue={setKeyword} />

              <AddUser
                key={editingUser?.id ?? 'new'}
                editingUser={editingUser}
                onSubmit={upsertUser}
                onCancelEdit={() => setEditingUser(null)}
              />

              <ResultTable
                users={paginatedUsers}
                totalItems={filteredUsers.length}
                loading={loading}
                error={error}
                currentPage={currentPage}
                totalPages={totalPages}
                pageSize={pageSize}
                pageSizeOptions={PAGE_SIZE_OPTIONS}
                onPageChange={setCurrentPage}
                onPageSizeChange={setPageSize}
                onEdit={setEditingUser}
                onDelete={removeUser}
              />
            </section>
          </main>
        )
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>
  </body>
</html>
