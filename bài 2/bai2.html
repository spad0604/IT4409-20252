<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Google</title>
</head>
<body>

  <!-- ===== HEADER: logo / tên trang ===== -->
  <header>
    <nav>
      <a href="#">Gmail</a> &nbsp;
      <a href="#">Hình ảnh</a> &nbsp;
    </nav>
  </header>

  <main>

    <h1>
      <img src="google_logo.png" alt="Google" width="272" height="92" />
    </h1>

    <!-- ===== Form tìm kiếm chính ===== -->
    <form action="https://www.google.com/search" method="get">

      <table>
        <tr>
          <!-- Icon kính lúp đặt trước ô tìm kiếm -->
          <td>
            <img src="search_icon.png" alt="Tìm kiếm" width="24" height="24" />
          </td>
          <td>
            <input
              type="search"
              name="q"
              size="55"
              placeholder="Tìm kiếm trên Google hoặc nhập URL"
              aria-label="Tìm kiếm"
            />
          </td>
          <!-- Icon mic đặt sau ô tìm kiếm -->
          <td>
            <img src="mic_icon.png" alt="Tìm kiếm bằng giọng nói" width="24" height="24" />
          </td>
        </tr>
      </table>

      <br /><br />

      <!-- Nút Tìm kiếm Google -->
      <input type="submit" value="Tìm kiếm Google" />
      &nbsp;

    </form>

    <p>
      Google được cung cấp bằng:
      <a href="#">Tiếng Việt</a> &nbsp;
      <a href="#">English</a>
    </p>

  </main>

  <!-- ===== FOOTER: MSSV + ngày tạo ===== -->
  <footer>
    <hr />
    <!-- Các liên kết phía dưới tương tự footer của Google -->
    <nav>
      <a href="#">Quảng cáo</a> &nbsp;
      <a href="#">Doanh nghiệp</a> &nbsp;
      <a href="#">Cách tìm kiếm hoạt động</a>
    </nav>
    <p>
      &copy; 2026 – Tạo bởi Nguyễn Văn Giáp &nbsp;|&nbsp;
      MSSV: 20225126 &nbsp;|&nbsp; Ngày tạo: 06/03/2026
    </p>
  </footer>

</body>
</html>
